name: CI Pipeline

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
      - "chore/**"
      - "refactor/**"
      - "docs/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Lint, Typecheck, Build & E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Verify Official English CV Content Parity
        run: npm run verify:cv-content

      - name: Run Code Linting
        run: npm run lint

      - name: Run Strict Type Check
        run: npm run typecheck

      - name: Run Next.js Production Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E & Accessibility Suite
        run: npx playwright test
        env:
          CI: true
