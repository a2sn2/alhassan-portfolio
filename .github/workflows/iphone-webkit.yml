name: iPhone WebKit Compatibility

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  webkit-iphone:
    name: iPhone WebKit responsive smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build production app
        run: npm run build
      - name: Install Playwright WebKit
        run: npx playwright install --with-deps webkit
      - name: Run iPhone WebKit compatibility tests
        run: npx playwright test --config=playwright.webkit.config.ts
        env:
          CI: true
      - name: Attach failure screenshots and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: iphone-webkit-failures
          path: test-results/
          if-no-files-found: ignore
